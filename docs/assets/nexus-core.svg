<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>
    <linearGradient id="ring2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#238636"/>
    </linearGradient>
    <linearGradient id="ring3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d2a8ff"/>
      <stop offset="100%" stop-color="#8957e5"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="url(#bg)" rx="12"/>

  <!-- Subtle grid -->
  <g stroke="#21262d" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="130" x2="800" y2="130"/>
    <line x1="0" y1="260" x2="800" y2="260"/>
    <line x1="0" y1="390" x2="800" y2="390"/>
    <line x1="200" y1="0" x2="200" y2="520"/>
    <line x1="400" y1="0" x2="400" y2="520"/>
    <line x1="600" y1="0" x2="600" y2="520"/>
  </g>

  <!-- Outer orbital ring -->
  <ellipse cx="400" cy="250" rx="340" ry="200" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="6 8" opacity="0.6"/>

  <!-- Middle orbital ring -->
  <ellipse cx="400" cy="250" rx="260" ry="150" fill="none" stroke="#388bfd" stroke-width="0.8" stroke-dasharray="4 10" opacity="0.4"/>

  <!-- Inner orbital ring -->
  <ellipse cx="400" cy="250" rx="170" ry="95" fill="none" stroke="#3fb950" stroke-width="0.8" stroke-dasharray="3 9" opacity="0.35"/>

  <!-- Connection lines from center -->
  <g stroke="#30363d" stroke-width="1.2" opacity="0.7">
    <line x1="400" y1="250" x2="400" y2="60"/>
    <line x1="400" y1="250" x2="200" y2="140"/>
    <line x1="400" y1="250" x2="600" y2="140"/>
    <line x1="400" y1="250" x2="140" y2="250"/>
    <line x1="400" y1="250" x2="660" y2="250"/>
    <line x1="400" y1="250" x2="200" y2="360"/>
    <line x1="400" y1="250" x2="600" y2="360"/>
    <line x1="400" y1="250" x2="400" y2="440"/>
  </g>

  <!-- Cross connections -->
  <g stroke="#21262d" stroke-width="0.6" opacity="0.4">
    <line x1="200" y1="140" x2="140" y2="250"/>
    <line x1="600" y1="140" x2="660" y2="250"/>
    <line x1="140" y1="250" x2="200" y2="360"/>
    <line x1="660" y1="250" x2="600" y2="360"/>
    <line x1="200" y1="140" x2="600" y2="140"/>
    <line x1="200" y1="360" x2="600" y2="360"/>
  </g>

  <!-- Center glow -->
  <circle cx="400" cy="250" r="80" fill="url(#glow)"/>
  <circle cx="400" cy="250" r="50" fill="url(#glow2)"/>

  <!-- Center core -->
  <circle cx="400" cy="250" r="38" fill="#0d1117" stroke="url(#ring1)" stroke-width="2"/>
  <circle cx="400" cy="250" r="30" fill="#161b22" stroke="#58a6ff" stroke-width="1" opacity="0.8"/>
  <text x="400" y="246" text-anchor="middle" fill="#e6edf3" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" letter-spacing="3">NEXUS</text>
  <text x="400" y="262" text-anchor="middle" fill="#8b949e" font-family="system-ui,-apple-system,sans-serif" font-size="7" letter-spacing="1.5">AI CORE</text>

  <!-- Node: PROVIDERS (top) -->
  <circle cx="400" cy="60" r="22" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <circle cx="400" cy="60" r="8" fill="#58a6ff" opacity="0.6"/>
  <text x="400" y="42" text-anchor="middle" fill="#e6edf3" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" letter-spacing="1">PROVIDERS</text>
  <text x="400" y="75" text-anchor="middle" fill="#8b949e" font-family="system-ui,-apple-system,sans-serif" font-size="7">Claude · GPT · Gemini</text>

  <!-- Node: AGENTS (top-right) -->
  <circle cx="600" cy="140" r="22" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <circle cx="600" cy="140" r="8" fill="#3fb950" opacity="0.6"/>
  <text x="600" y="122" text-anchor="middle" fill="#e6edf3" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" letter-spacing="1">AGENTS</text>
  <text x="600" y="165" text-anchor="middle" fill="#8b949e" font-family="system-ui,-apple-system,sans-serif" font-size="7">Harness · Tools · Loop</text>

  <!-- Node: TOOLS (right) -->
  <circle cx="660" cy="250" r="22" fill="#0d1117" stroke="#d2a8ff" stroke-width="1.5"/>
  <circle cx="660" cy="250" r="8" fill="#d2a8ff" opacity="0.6"/>
  <text x="660" y="232" text-anchor="middle" fill="#e6edf3" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" letter-spacing="1">TOOLS</text>
  <text x="660" y="270" text-anchor="middle" fill="#8b949e" font-family="system-ui,-apple-system,sans-serif" font-size="7">FS · Terminal · Git</text>

  <!-- Node: PERMISSIONS (bottom-right) -->
  <circle cx="600" cy="360" r="22" fill="#0d1117" stroke="#f0883e" stroke-width="1.5"/>
  <circle cx="600" cy="360" r="8" fill="#f0883e" opacity="0.6"/>
  <text x="600" y="342" text-anchor="middle" fill="#e6edf3" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" letter-spacing="1">SECURITY</text>
  <text x="600" y="380" text-anchor="middle" fill="#8b949e" font-family="system-ui,-apple-system,sans-serif" font-size="7">Policies · Modes · Audit</text>

  <!-- Node: SESSIONS (bottom) -->
  <circle cx="400" cy="440" r="22" fill="#0d1117" stroke="#79c0ff" stroke-width="1.5"/>
  <circle cx="400" cy="440" r="8" fill="#79c0ff" opacity="0.6"/>
  <text x="400" y="422" text-anchor="middle" fill="#e6edf3" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" letter-spacing="1">SESSIONS</text>
  <text x="400" y="458" text-anchor="middle" fill="#8b949e" font-family="system-ui,-apple-system,sans-serif" font-size="7">History · Context · Memory</text>

  <!-- Node: CONTEXT (bottom-left) -->
  <circle cx="200" cy="360" r="22" fill="#0d1117" stroke="#56d364" stroke-width="1.5"/>
  <circle cx="200" cy="360" r="8" fill="#56d364" opacity="0.6"/>
  <text x="200" y="342" text-anchor="middle" fill="#e6edf3" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" letter-spacing="1">CONTEXT</text>
  <text x="200" y="380" text-anchor="middle" fill="#8b949e" font-family="system-ui,-apple-system,sans-serif" font-size="7">Assembly · Truncate · Build</text>

  <!-- Node: ROUTING (left) -->
  <circle cx="140" cy="250" r="22" fill="#0d1117" stroke="#e3b341" stroke-width="1.5"/>
  <circle cx="140" cy="250" r="8" fill="#e3b341" opacity="0.6"/>
  <text x="140" y="232" text-anchor="middle" fill="#e6edf3" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" letter-spacing="1">ROUTING</text>
  <text x="140" y="270" text-anchor="middle" fill="#8b949e" font-family="system-ui,-apple-system,sans-serif" font-size="7">Fallback · Multi-provider</text>

  <!-- Node: EXTENSIONS (top-left) -->
  <circle cx="200" cy="140" r="22" fill="#0d1117" stroke="#ff7b72" stroke-width="1.5"/>
  <circle cx="200" cy="140" r="8" fill="#ff7b72" opacity="0.6"/>
  <text x="200" y="122" text-anchor="middle" fill="#e6edf3" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" letter-spacing="1">EXTENSIONS</text>
  <text x="200" y="165" text-anchor="middle" fill="#8b949e" font-family="system-ui,-apple-system,sans-serif" font-size="7">Skills · MCP · Plugins</text>

  <!-- Decorative dots on orbits -->
  <circle cx="260" cy="95" r="3" fill="#58a6ff" opacity="0.5"/>
  <circle cx="540" cy="95" r="3" fill="#3fb950" opacity="0.5"/>
  <circle cx="700" cy="200" r="3" fill="#d2a8ff" opacity="0.5"/>
  <circle cx="100" cy="200" r="3" fill="#e3b341" opacity="0.5"/>
  <circle cx="260" cy="405" r="3" fill="#56d364" opacity="0.5"/>
  <circle cx="540" cy="405" r="3" fill="#f0883e" opacity="0.5"/>
  <circle cx="400" cy="40" r="3" fill="#79c0ff" opacity="0.5"/>

  <!-- Label: CLI -->
  <rect x="340" y="480" width="120" height="28" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="400" y="499" text-anchor="middle" fill="#e6edf3" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" letter-spacing="2">NEXUS CLI</text>

  <!-- Vertical connector CLI to SESSIONS -->
  <line x1="400" y1="462" x2="400" y2="472" stroke="#30363d" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Tagline -->
  <text x="400" y="30" text-anchor="middle" fill="#484f58" font-family="system-ui,-apple-system,sans-serif" font-size="9" letter-spacing="4">UNIVERSAL AI DEVELOPMENT INFRASTRUCTURE</text>
</svg>
