<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </radialGradient>
  </defs>

  <rect width="700" height="500" fill="url(#bg3)" rx="12"/>

  <text x="350" y="28" text-anchor="middle" fill="#484f58" font-family="system-ui,-apple-system,sans-serif" font-size="9" letter-spacing="4">THE NEXUS STACK</text>

  <!-- Top layer: CLI / UX -->
  <rect x="50" y="50" width="600" height="52" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="350" y="72" text-anchor="middle" fill="#e6edf3" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" letter-spacing="3">NEXUS CLI</text>
  <text x="350" y="92" text-anchor="middle" fill="#8b949e" font-family="system-ui,-apple-system,sans-serif" font-size="9">commander · tui · interactive session · streaming</text>

  <!-- Arrow -->
  <line x1="350" y1="102" x2="350" y2="118" stroke="#388bfd" stroke-width="1"/>

  <!-- Layer: Config -->
  <rect x="50" y="122" width="600" height="48" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="100" y="146" text-anchor="middle" fill="#e6edf3" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" letter-spacing="2">CONFIG</text>
  <text x="100" y="162" text-anchor="middle" fill="#8b949e" font-family="system-ui,-apple-system,sans-serif" font-size="8">providers · models · permissions · workflows</text>
  <line x1="180" y1="128" x2="180" y2="164" stroke="#30363d" stroke-width="1"/>
  <text x="240" y="146" text-anchor="middle" fill="#e6edf3" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" letter-spacing="2">PATHS</text>
  <text x="240" y="162" text-anchor="middle" fill="#8b949e" font-family="system-ui,-apple-system,sans-serif" font-size="8">~/.nexus · .forge/</text>
  <line x1="310" y1="128" x2="310" y2="164" stroke="#30363d" stroke-width="1"/>
  <text x="420" y="146" text-anchor="middle" fill="#e6edf3" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" letter-spacing="2">SESSIONS</text>
  <text x="420" y="162" text-anchor="middle" fill="#8b949e" font-family="system-ui,-apple-system,sans-serif" font-size="8">save · load · append · history</text>
  <line x1="510" y1="128" x2="510" y2="164" stroke="#30363d" stroke-width="1"/>
  <text x="600" y="146" text-anchor="middle" fill="#e6edf3" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" letter-spacing="2">UTILS</text>
  <text x="600" y="162" text-anchor="middle" fill="#8b949e" font-family="system-ui,-apple-system,sans-serif" font-size="8">fs · logger · detect</text>

  <!-- Arrow -->
  <line x1="350" y1="170" x2="350" y2="186" stroke="#388bfd" stroke-width="1"/>

  <!-- Layer: Harness + Context + Permissions -->
  <rect x="50" y="190" width="600" height="80" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <line x1="250" y1="196" x2="250" y2="264" stroke="#30363d" stroke-width="1"/>
  <line x1="450" y1="196" x2="450" y2="264" stroke="#30363d" stroke-width="1"/>

  <text x="150" y="214" text-anchor="middle" fill="#d2a8ff" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" letter-spacing="2">AGENT HARNES</text>
  <text x="150" y="230" text-anchor="middle" fill="#8b949e" font-family="system-ui,-apple-system,sans-serif" font-size="8">tool loop · streaming · cost</text>
  <text x="150" y="246" text-anchor="middle" fill="#8b949e" font-family="system-ui,-apple-system,sans-serif" font-size="8">tokens · events · cancel</text>

  <text x="350" y="214" text-anchor="middle" fill="#58a6ff" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" letter-spacing="2">CONTEXT BUILDER</text>
  <text x="350" y="230" text-anchor="middle" fill="#8b949e" font-family="system-ui,-apple-system,sans-serif" font-size="8">project · git · files</text>
  <text x="350" y="246" text-anchor="middle" fill="#8b949e" font-family="system-ui,-apple-system,sans-serif" font-size="8">truncate · summarize · compact</text>

  <text x="550" y="214" text-anchor="middle" fill="#f0883e" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" letter-spacing="2">PERMISSION ENGINE</text>
  <text x="550" y="230" text-anchor="middle" fill="#8b949e" font-family="system-ui,-apple-system,sans-serif" font-size="8">safe · normal · sandbox · relaxed</text>
  <text x="550" y="246" text-anchor="middle" fill="#8b949e" font-family="system-ui,-apple-system,sans-serif" font-size="8">policies · audit · decisions</text>

  <!-- Arrow -->
  <line x1="350" y1="270" x2="350" y2="286" stroke="#388bfd" stroke-width="1"/>

  <!-- Layer: Providers -->
  <rect x="50" y="290" width="600" height="56" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.2"/>
  <text x="350" y="314" text-anchor="middle" fill="#e6edf3" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" letter-spacing="2">PROVIDERS</text>
  <text x="350" y="334" text-anchor="middle" fill="#8b949e" font-family="system-ui,-apple-system,sans-serif" font-size="9">openrouter  ·  anthropic  ·  openai  ·  ollama  ·  lmstudio  ·  custom  ·  omniroute</text>

  <!-- Arrow -->
  <line x1="350" y1="346" x2="350" y2="362" stroke="#388bfd" stroke-width="1"/>

  <!-- Layer: Tools -->
  <rect x="50" y="366" width="600" height="52" rx="6" fill="#161b22" stroke="#f0883e" stroke-width="1.2"/>
  <text x="350" y="390" text-anchor="middle" fill="#e6edf3" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" letter-spacing="2">TOOLS</text>
  <text x="350" y="408" text-anchor="middle" fill="#8b949e" font-family="system-ui,-apple-system,sans-serif" font-size="9">filesystem  ·  terminal  ·  git  ·  11 built-in tools  ·  permission-gated</text>

  <!-- Arrow -->
  <line x1="350" y1="418" x2="350" y2="434" stroke="#388bfd" stroke-width="1"/>

  <!-- Layer: Extensibility -->
  <rect x="50" y="438" width="600" height="44" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="350" y="456" text-anchor="middle" fill="#484f58" font-family="system-ui,-apple-system,sans-serif" font-size="10" letter-spacing="3">EXTENSIBILITY LAYER — SKILLS · MCP · PLUGINS · WORKFLOWS · AGENTS</text>
  <text x="350" y="472" text-anchor="middle" fill="#30363d" font-family="system-ui,-apple-system,sans-serif" font-size="8">type system defined · implementation in progress</text>
</svg>
